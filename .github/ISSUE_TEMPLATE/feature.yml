name: Feature request
description: Suggest a focused improvement within the plugin's safety scope
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project intentionally handles one workspace at a time and does not provide autostart, automatic restore, or restoration into occupied workspaces.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Explain the smallest behavior that would solve it.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility impact
      description: Could this launch apps, change windows, store additional data, or alter a public contract?
    validations:
      required: true

